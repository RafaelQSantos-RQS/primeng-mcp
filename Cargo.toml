[package]
name = "primeng-mcp"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
fuzzy-matcher = "0.3.7"
reqwest = { version = "0.13.5", features = ["rustls"] }
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-io"] }
rust-embed = "8.13.0"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
