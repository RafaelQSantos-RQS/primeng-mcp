context: |
  O PrimeNG só disponibiliza endpoints LLMs.txt (/llms/llms.txt, /llms/components/*.md)
  a partir da versão 21. Versões anteriores (v20, v19, etc.) não possuem esses endpoints.
  Todo o projeto primeng-mcp depende desse padrão e portanto só suporta PrimeNG v21+.
  A URL base é https://primeng.dev/llms/ para "latest" e https://v{N}.primeng.org/llms/ para versões específicas (N >= 21).

